<!DOCTYPE html>
<html>
<head>
    <title>Student Grade Calculator</title>
</head>
<body>
    <h2>Student Grade Calculator</h2>
    <form method="POST" action="/calculate">
        <label>Marks 1:</label><input type="number" name="m1" required><br><br>
        <label>Marks 2:</label><input type="number" name="m2" required><br><br>
        <label>Marks 3:</label><input type="number" name="m3" required><br><br>
        <button type="submit">Calculate</button>
    </form>
    {% if result %}
    <h3>Results:</h3>
    <p>Total: {{ result.total }}</p>
    <p>Average: {{ result.average }}</p>
    {% endif %}
</body>
</html>
