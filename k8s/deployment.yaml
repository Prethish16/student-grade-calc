apiVersion: apps/v1
kind: Deployment
metadata:
  name: grade-calc-deployment
  labels:
    app: grade-calc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grade-calc
  template:
    metadata:
      labels:
        app: grade-calc
    spec:
      containers:
      - name: grade-calc-container
        image: DOCKERHUB_IMAGE_PLACEHOLDER
        ports:
        - containerPort: 5000
