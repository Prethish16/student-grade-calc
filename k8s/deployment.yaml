apiVersion: apps/v1
kind: Deployment
metadata:
  name: grade-calc-deployment
  labels:
    app: grade-calc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grade-calc
  template:
    metadata:
      labels:
        app: grade-calc
    spec:
      containers:
      - name: grade-calc-container
        image: prethish16/student-garde-calc:f0ec1f2a937e12c824fe16c38d2aef059529f997
        ports:
        - containerPort: 5000
        imagePullPolicy: Always
